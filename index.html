<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SJscanner</title>
<meta name="description" content="SJscanner — ماسح المستندات: قص تلقائي، فلاتر، PDF، واستخراج النص">
<meta name="theme-color" content="#F1F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SJscanner">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Medium.ttf) format("truetype");font-weight:500 600;font-display:swap}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{--bg:#F1F5F4;--surface:#fff;--ink:#14201F;--mute:#5E6B6A;--line:#DCE5E3;--pri:#0F7F77;--onpri:#fff;--priSoft:rgba(15,127,119,.1);--tealL:#17A497;--deep:#0B4F4C;--amber:#F2A93B;--err:#C8423B;--chip:#fff;--shadow:0 10px 30px rgba(11,79,76,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1414;--surface:#161D1D;--ink:#E7EFEE;--mute:#9AA9A7;--line:#263131;--pri:#5CC8BA;--onpri:#00201D;--priSoft:rgba(92,200,186,.12);--err:#F08A83;--chip:#161D1D;--shadow:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Plex,-apple-system,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.view{display:none;min-height:100%;flex-direction:column}
.view.on{display:flex}
.safe-top{padding-top:env(safe-area-inset-top)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:16px;font-weight:600;font-size:16px;white-space:nowrap;position:relative;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--pri);color:var(--onpri)}
.btn.line{border:1.4px solid var(--line);background:var(--surface)}
.btn:disabled{opacity:.45}
/* home */
.head{display:flex;align-items:center;gap:12px;padding:16px 20px}
.head img{width:44px;height:44px;border-radius:12px}
.brand{font-weight:700;font-size:22px;line-height:1.1;direction:ltr;text-align:right}
.brand b{color:var(--pri)}
.sub{font-size:13px;color:var(--mute)}
.hero{margin:0 20px;border-radius:28px;background:linear-gradient(135deg,var(--tealL),var(--deep));color:#fff;padding:24px 22px 22px;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(11,79,76,.28)}
.hero::before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;font-weight:700}
.hero p{margin:0 0 20px;color:rgba(255,255,255,.86);font-size:14px;line-height:1.6;max-width:30ch}
.hero .row{display:flex;gap:10px}
.hero .row label{flex:3}.hero .row label+label{flex:2}
.hero .btn{width:100%}
.hero .cam{background:#fff;color:var(--deep)}
.hero .gal{border:1.4px solid rgba(255,255,255,.6);color:#fff}
.brk{position:absolute;inset-inline-end:22px;top:22px;width:54px;height:54px}
.install{margin:14px 20px 0;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:14px}
.install b{display:block}
.install span{color:var(--mute);font-size:13px}
.install button{margin-inline-start:auto;color:var(--mute);padding:6px}
.search{margin:14px 20px 0;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:0 14px;border:1px solid var(--line)}
.search input{flex:1;border:0;background:none;outline:0;min-height:50px;font-size:16px;-webkit-user-select:text;user-select:text}
.sec{display:flex;align-items:center;gap:8px;padding:20px 24px 12px}
.sec h2{margin:0;font-size:20px}
.count{background:var(--priSoft);color:var(--pri);font-weight:600;border-radius:20px;padding:0 10px;font-size:14px}
.list{padding:0 20px calc(28px + env(safe-area-inset-bottom));display:grid;gap:12px}
@media(min-width:720px){.list{grid-template-columns:1fr 1fr}}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;text-align:start;width:100%}
.card .th{width:62px;height:80px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow:hidden;flex:none}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{flex:1}
.card .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta small{display:flex;align-items:center;gap:4px;color:var(--mute);font-size:13px;margin-top:6px}
.card .meta small svg{width:16px;height:16px;color:var(--pri)}
.more{width:44px;height:44px;display:grid;place-items:center;color:var(--mute);border-radius:12px}
.empty{text-align:center;padding:20px 32px 60px;color:var(--mute)}
.empty .ic{width:96px;height:96px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;margin:10px auto 18px}
.empty .ic svg{width:44px;height:44px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* doc */
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:60px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--priSoft)}
.title{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;font-size:18px;padding:6px;border-radius:10px;text-align:start}
.title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title svg{width:18px;height:18px;color:var(--mute)}
.pager{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0;position:relative}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:44px 22px 12px;position:relative}
.slide .pg{position:relative;max-width:100%;max-height:100%;display:grid;place-items:center}
.slide img{max-width:100%;max-height:calc(100vh - 430px);max-height:calc(100dvh - 430px);min-height:120px;display:block;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.16);background:#fff;-webkit-user-drag:none}
.slide .spin{position:absolute}
.pnum{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(20,32,31,.82);color:#fff;font-size:13px;font-weight:600;padding:3px 14px;border-radius:20px;z-index:2;direction:ltr}
.docmain{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:14px;border:1.3px solid var(--line);background:var(--chip);font-weight:600;font-size:15px;white-space:nowrap;flex:none}
.chip svg{width:18px;height:18px;color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.chip.on svg{color:var(--onpri)}
.chip.txt{border-color:transparent;background:none;color:var(--pri)}
.tools{display:flex;padding:8px 8px 4px}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;font-size:12.5px;font-weight:500;border-radius:16px}
.tool i{width:46px;height:46px;border-radius:15px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.tool.dan i{background:rgba(200,66,59,.09);color:var(--err)}
.tool.dan{color:var(--err)}
.tool:disabled{opacity:.35}
.foot{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.foot .btn{flex:1}
/* crop */
#crop{background:#0B1111;color:#fff;height:100vh;height:100dvh}
#crop .bar{color:#fff}
#crop .bar b{font-weight:600;font-size:18px}
.stage{flex:1;position:relative;touch-action:none;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cfoot{display:flex;align-items:center;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#131B1B}
.cb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;color:#fff;font-size:12px;border-radius:14px}
.cb span{color:rgba(255,255,255,.7)}
.cfoot .btn{flex:1;background:#5CC8BA;color:#00201D}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.scrim.center{align-items:center;padding:24px}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:10px 0 calc(14px + env(safe-area-inset-bottom));max-height:88vh;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .22s}
.scrim.show .sheet{transform:none}
.handle{width:36px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 12px}
.sa{display:flex;align-items:center;gap:14px;padding:10px 24px;text-align:start;width:100%}
.sa:active{background:var(--priSoft)}
.sa i{width:44px;height:44px;border-radius:14px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex:none}
.sa b{display:block;font-weight:600}
.sa small{color:var(--mute);font-size:13px}
.sa.dan i{background:rgba(200,66,59,.09);color:var(--err)}
.sa.dan b{color:var(--err)}
.sh{padding:0 24px 8px}
.sh h3{margin:0;font-size:20px}
.sh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.dlg{background:var(--surface);border-radius:24px;padding:22px;width:100%;max-width:400px;transform:scale(.96);transition:transform .2s}
.scrim.show .dlg{transform:none}
.dlg h3{margin:0 0 8px;font-size:20px}
.dlg p{margin:0 0 18px;color:var(--mute)}
.dlg input{width:100%;min-height:50px;border-radius:14px;border:1.4px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;margin-bottom:18px;outline:0;-webkit-user-select:text;user-select:text}
.dlg input:focus{border-color:var(--pri)}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end}
.dlg .acts .btn{min-height:46px;padding:0 20px}
.dlg .btn.danger{background:var(--err);color:#fff}
.dlg .btn.ghost{color:var(--pri)}
.ord{overflow-y:auto;padding:0 16px 8px}
.orow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--bg);margin-bottom:8px}
.orow img{width:46px;height:60px;object-fit:cover;border-radius:8px;background:#fff}
.orow b{flex:1;font-weight:500}
.ocr{padding:0 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.ocr textarea{width:100%;min-height:40vh;border-radius:16px;border:0;background:var(--bg);padding:14px;font-size:15px;line-height:1.7;resize:none;-webkit-user-select:text;user-select:text;outline:0}
.ocr .acts{display:flex;gap:12px}
.ocr .acts .btn{flex:1}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center}
.busy>div{background:var(--surface);border-radius:22px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;font-weight:500;max-width:80vw;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:3.2px solid var(--priSoft);border-top-color:var(--pri);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));margin:auto;max-width:480px;background:#1E2B2A;color:#fff;border-radius:14px;padding:12px 16px;z-index:60;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none}
.toast.show{transform:none;opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></symbol>
<symbol id="i-gal" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="m4 18 5-5 4 4 3-3 4 4"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-crop" viewBox="0 0 24 24"><path d="M7 3v14h14M3 7h14v14"/></symbol>
<symbol id="i-rot" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></symbol>
<symbol id="i-txt" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
<symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 14.5h1.5a1.3 1.3 0 0 0 0-2.6H9v5"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m4 17 5-5 4 4 2.5-2.5L20 17"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="18.5" r="1.3" fill="currentColor"/></symbol>
<symbol id="i-srch" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4z"/><path d="m4 12 8 4 8-4M4 16l8 4 8-4"/></symbol>

<symbol id="i-addp" viewBox="0 0 24 24"><path d="M4 8h3l2-3h5M20 11v8H4V8"/><circle cx="12" cy="13" r="3.4"/><path d="M19 3v6M16 6h6"/></symbol>
<symbol id="i-wand" viewBox="0 0 24 24"><path d="M5 19 16 8M14 6l4 4"/><path d="M19 3v3M17.5 4.5h3M6 4v2M5 5h2"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
<symbol id="i-tone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 7h4M12 11h6M12 15h5" /></symbol>
<symbol id="i-bw" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></symbol>
<symbol id="i-all" viewBox="0 0 24 24"><path d="m2 12.5 4 4L13 9.5M11 15l1.5 1.5L22 7"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<!-- HOME -->
<section id="home" class="view on safe-top">
  <div class="head">
    <img src="icons/logo.png" alt="">
    <div><div class="brand"><b>SJ</b>scanner</div><div class="sub">ماسح المستندات</div></div>
  </div>
  <div class="hero">
    <svg class="brk" viewBox="0 0 54 54"><path d="M2 16V2h14M38 2h14v14M52 38v14H38M16 52H2V38" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/><path d="M-4 27h62" stroke="#F2A93B" stroke-width="3.5" stroke-linecap="round"/></svg>
    <h1>امسح مستنداتك بوضوح</h1>
    <p>قصّ تلقائي للحواف، تصحيح الميلان، وفلاتر تجعل الورقة بيضاء ونظيفة.</p>
    <div class="row">
      <label class="btn cam"><svg class="i"><use href="#i-cam"/></svg>الكاميرا<input class="vh" type="file" accept="image/*" capture="environment" data-target="new"></label>
      <label class="btn gal"><svg class="i"><use href="#i-gal"/></svg>المعرض<input class="vh" type="file" accept="image/*" multiple data-target="new"></label>
    </div>
  </div>
  <div class="install" id="install" hidden>
    <img src="icons/icon-192.png" alt="" width="40" height="40" style="border-radius:10px">
    <div><b>ثبّته على الشاشة الرئيسية</b><span>اضغط زر المشاركة <svg class="i" style="width:16px;height:16px;vertical-align:-3px"><use href="#i-share"/></svg> ثم «إضافة إلى الشاشة الرئيسية»</span></div>
    <button id="installX" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="search" id="searchBox" hidden><svg class="i" style="color:var(--mute)"><use href="#i-srch"/></svg><input id="q" placeholder="ابحث في مستنداتك" type="search"></div>
  <div class="sec"><h2>مستنداتي</h2><span class="count" id="count" hidden></span></div>
  <div id="docs" class="list"></div>
</section>

<!-- DOCUMENT -->
<section id="doc" class="view safe-top" style="height:100vh;height:100dvh">
  <div class="bar">
    <button class="ib" id="back" aria-label="رجوع"><svg class="i"><use href="#i-back"/></svg></button>
    <button class="title" id="dname"><span id="dnameT"></span><svg class="i"><use href="#i-edit"/></svg></button>
    <button class="ib" id="dshare" aria-label="مشاركة PDF"><svg class="i"><use href="#i-share"/></svg></button>
  </div>
  <div class="docmain">
    <div class="pnum" id="pnum"></div>
    <div class="pager" id="pager"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <button class="tool" id="tCrop"><i><svg class="i"><use href="#i-crop"/></svg></i>قص</button>
    <button class="tool" id="tRot"><i><svg class="i"><use href="#i-rot"/></svg></i>تدوير</button>

async function addFiles(files, doc) {
  const target = doc || {id: uid(), name: defName(), created: Date.now(), updated: Date.now(), pages: []};
  const n = files.length; let added = 0;
  for (let i = 0; i < n; i++) {
    busy(n === 1 ? 'جارٍ قصّ الورقة وتحسينها…' : `جارٍ تجهيز الصفحة ${i + 1} من ${n}…`); await tick();
    try {
      const c = await toCanvas(files[i], MAXO);
      const q = detect(c);
      const p = {id: uid(), w: c.width, h: c.height, quad: q, auto: q, filter: 'enh', rot: 0, v: 0};
      await putBlob('o:' + p.id, await toBlob(c, .92));
      origCache.set(p.id, c);
      await renderPage(p);
      target.pages.push(p); added++;
    } catch (e) { console.error(e); }
  }
  busy();
  if (!added) { toast('تعذّرت معالجة الصورة، جرّب صورة أخرى'); return {doc: target, added: 0}; }

  await saveDoc(target);
  return {doc: target, added};

  const inp = e.target; if (!inp.matches || !inp.matches('input[type=file]')) return;

    const r = await addFiles(files, null);
    if (r.added) openDoc(r.doc, 0);
  } else if (cur) {
    const start = cur.pages.length; const n = (await addFiles(files, cur)).added;
    if (n) { renderDoc(start); toast(n === 1 ? 'أُضيفت صفحة جديدة' : `أُضيفت ${pagesWord(n)}`); }
  }

  const ok = await confirmDlg(last ? 'حذف المستند؟' : `حذف الصفحة ${idx + 1}؟`, last ? 'هذه آخر صفحة، وحذفها سيحذف المستند بالكامل.' : 'لا يمكن التراجع عن هذا الإجراء.', 'حذف');
  if (!ok) return;
  if (last) { await removeDoc(cur); cur = null; show('home'); renderHome(); return; }
  cur.pages.splice(idx, 1); delPageBlobs(p); await saveDoc(cur); renderDoc(Math.min(idx, cur.pages.length - 1));
};
function delPageBlobs(p) { delBlob('o:' + p.id); delBlob(procKey(p)); dropUrl(procKey(p)); origCache.delete(p.id); }
async function removeDoc(d) { docs = docs.filter(x => x !== d); d.pages.forEach(delPageBlobs); await delDocRec(d.id).catch(() => {}); }
$('#addPage').onclick = () => sheet('إضافة صفحة', '', [
  {icon: 'cam', t: 'تصوير بالكاميرا', s: 'صوّر الورقة الآن', file: $('#addCam')},
  {icon: 'gal', t: 'اختيار من المعرض', s: 'يمكنك اختيار عدة صور مرة واحدة', file: $('#addGal')},
]);
$('#tOrd').onclick = () => {
  const o = overlay(`<div class="sheet"><div class="handle"></div><div class="sh"><h3>ترتيب الصفحات</h3><p>استخدم الأسهم لتحريك الصفحة للأعلى أو للأسفل</p></div><div class="ord" id="ord"></div></div>`);
  const draw = async () => {
    const box = o.el.querySelector('#ord');
    box.innerHTML = cur.pages.map((p, i) => `<div class="orow"><img alt="" data-o="${i}"><b>صفحة ${i + 1}</b><button class="ib" data-up="${i}" ${i === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="للأعلى">${icon('up')}</button><button class="ib" data-dn="${i}" ${i === cur.pages.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="للأسفل">${icon('down')}</button></div>`).join('');
    for (let i = 0; i < cur.pages.length; i++) box.querySelector(`[data-o="${i}"]`).src = await urlFor(procKey(cur.pages[i]));
  };
  o.el.addEventListener('click', e => {
    const u = e.target.closest('[data-up]'), dn = e.target.closest('[data-dn]'); if (!u && !dn) return;
    const i = +(u ? u.dataset.up : dn.dataset.dn), j = u ? i - 1 : i + 1; const a = cur.pages; [a[i], a[j]] = [a[j], a[i]];
    saveDoc(cur); draw(); renderDoc(j);
  });
  draw();
};

/* ================= export ================= */
function canShareFiles(f) { try { return !!(navigator.canShare && navigator.canShare({files: [f]})); } catch (e) { return false; } }
function download(blob, name) { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 30000); }
async function shareOrDownload(blob, name, type) {
  const f = new File([blob], name, {type});
  if (canShareFiles(f)) { try { await navigator.share({files: [f], title: name}); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  download(blob, name); toast('تم تنزيل الملف');
}
async function buildPdf(d) {
  if (!window.jspdf) throw new Error('nopdf');
  let pdf = null;
  for (let i = 0; i < d.pages.length; i++) {
    busy(`جارٍ إنشاء PDF… صفحة ${i + 1} من ${d.pages.length}`); await tick();
    const p = d.pages[i], b = await getBlob(procKey(p)); const data = new Uint8Array(await b.arrayBuffer());
    const land = p.pw > p.ph, pw = land ? 297 : 210, ph = land ? 210 : 297;
    if (!pdf) pdf = new window.jspdf.jsPDF({orientation: land ? 'l' : 'p', unit: 'mm', format: 'a4', compress: true}); else pdf.addPage('a4', land ? 'l' : 'p');
    const k = Math.min(pw / p.pw, ph / p.ph), w = p.pw * k, h = p.ph * k;
    pdf.addImage(data, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
  }
  pdf.setProperties({title: d.name, creator: 'SJscanner'});
  busy(); return pdf.output('blob');
}
async function sharePdf(d) { try { const b = await buildPdf(d); await shareOrDownload(b, safeName(d.name) + '.pdf', 'application/pdf'); } catch (e) { busy(); toast('تعذّر إنشاء ملف PDF'); } }
async function downloadPdf(d) { try { const b = await buildPdf(d); download(b, safeName(d.name) + '.pdf'); toast('تم تنزيل ملف PDF'); } catch (e) { busy(); toast('تعذّر إنشاء ملف PDF'); } }
$('#dshare').onclick = () => sharePdf(cur);
$('#exportBtn').onclick = () => {
  const d = cur, i = idx;
  sheet('حفظ ومشاركة', pagesWord(d.pages.length), [
    {icon: 'share', t: 'مشاركة PDF أو حفظه في «الملفات»', s: 'واتساب، البريد، الملفات…', go: () => sharePdf(d)},
    {icon: 'dl', t: 'تنزيل PDF', s: 'يُحفظ في التنزيلات', go: () => downloadPdf(d)},
    {icon: 'img', t: `مشاركة الصفحة ${i + 1} كصورة`, s: 'أو حفظها في الصور', go: async () => { const b = await getBlob(procKey(d.pages[i])); shareOrDownload(b, `${safeName(d.name)}-${i + 1}.jpg`, 'image/jpeg'); }},
  ]);
};

/* ================= text extraction (Arabic + English, on device) ================= */
let ocrWorker = null, ocrLoading = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
$('#tTxt').onclick = async () => {
  const p = cur.pages[idx];
  const o = overlay(`<div class="sheet"><div class="handle"></div><div class="sh"><h3>النص المستخرج</h3><p>القراءة تتم على جهازك وتدعم العربية والإنجليزية</p></div><div class="ocr"><div id="ost" class="sub">جارٍ التحضير…</div><div class="prog"><i id="obar"></i></div><textarea id="otx" readonly dir="auto" placeholder="سيظهر النص هنا"></textarea><div class="acts"><button class="btn fill" id="ocopy" disabled>${icon('copy')}نسخ</button><button class="btn line" id="oshare" disabled>${icon('share')}مشاركة</button></div></div></div>`);
  const st = o.el.querySelector('#ost'), bar = o.el.querySelector('#obar'), tx = o.el.querySelector('#otx');
  const prog = (label, v) => { st.textContent = label; bar.style.width = Math.round(v * 100) + '%'; };
  try {
    if (!ocrWorker) {
      if (!ocrLoading) ocrLoading = (async () => {
        if (!window.Tesseract) await loadScript('vendor/tesseract.min.js');
        return Tesseract.createWorker(['ara', 'eng'], 1, {
          logger: m => { if (m.status && /load|init/i.test(m.status)) prog('جارٍ تحميل بيانات القراءة (أول مرة فقط)…', m.progress || 0); else if (m.status === 'recognizing text') prog('جارٍ قراءة النص…', m.progress || 0); }
        });
      })();
      ocrWorker = await ocrLoading;
    }
    prog('جارٍ قراءة النص…', .05);
    const blob = await getBlob(procKey(p));
    const r = await ocrWorker.recognize(blob);
    const text = (r.data.text || '').trim();
    tx.value = text || 'لم يُعثر على نص في هذه الصفحة.';
    prog(text ? 'تم. راجع النص قبل استخدامه، فقد تقع أخطاء بسيطة.' : 'لا يوجد نص مقروء', 1);
    if (text) {
      o.el.querySelector('#ocopy').disabled = false; o.el.querySelector('#oshare').disabled = false;
      o.el.querySelector('#ocopy').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('تم نسخ النص'); } catch (e) { tx.removeAttribute('readonly'); tx.select(); toast('حدّد النص وانسخه يدوياً'); } };
      o.el.querySelector('#oshare').onclick = () => { if (navigator.share) navigator.share({text}).catch(() => {}); else download(new Blob([text], {type: 'text/plain'}), safeName(cur.name) + '.txt'); };
    }
  } catch (e) {
    console.error(e); ocrLoading = null; ocrWorker = null;
    prog('تعذّر تحميل أداة القراءة. تحتاج اتصالاً بالإنترنت في أول استخدام.', 0);
  }
};

/* ================= manual crop (only via "قص") ================= */
const cv = $('#cv'), cx = cv.getContext('2d');
let crop = null, sc = 1, offX = 0, offY = 0, drag = -1, vw = 0, vh = 0;
$('#tCrop').onclick = async () => {
  const p = cur.pages[idx]; busy('جارٍ الفتح…'); await tick();
  try { const c = await getOrig(p); crop = {p, c, quad: p.quad.map(a => [...a])}; busy(); show('crop'); } catch (e) { busy(); toast('تعذّر فتح الصورة'); }
};
function layoutCrop() {
  if (!crop) return; const r = $('#stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  vw = r.width; vh = r.height; if (!vw || !vh) return;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  const pad = 28; sc = Math.min((vw - pad*2) / crop.c.width, (vh - pad*2) / crop.c.height);
  offX = (vw - crop.c.width * sc) / 2; offY = (vh - crop.c.height * sc) / 2; drawCrop();
}
const toS = p => [offX + p[0] * sc, offY + p[1] * sc];
function drawCrop() {
  if (!crop) return; const dpr = window.devicePixelRatio || 1, c = crop.c, q = crop.quad.map(toS), ok = quadOk(crop.quad, c.width, c.height), col = ok ? '#17A497' : '#F2A93B';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, vw, vh);
  cx.drawImage(c, offX, offY, c.width * sc, c.height * sc);
  cx.beginPath(); cx.rect(offX, offY, c.width * sc, c.height * sc); cx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < 4; i++) cx.lineTo(q[i][0], q[i][1]); cx.closePath();
  cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fill('evenodd');
  cx.beginPath(); cx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < 4; i++) cx.lineTo(q[i][0], q[i][1]); cx.closePath(); cx.lineWidth = 2.5; cx.strokeStyle = col; cx.stroke();
  q.forEach((p, i) => { const r = i === drag ? 16 : 12; cx.beginPath(); cx.arc(p[0], p[1], r + 6, 0, 7); cx.fillStyle = col + '40'; cx.fill(); cx.beginPath(); cx.arc(p[0], p[1], r, 0, 7); cx.fillStyle = '#fff'; cx.fill(); cx.lineWidth = 3; cx.strokeStyle = col; cx.stroke(); });
  if (drag >= 0) {
    const p = crop.quad[drag], sp = q[drag], R = 58, z = 2.6, lx = sp[0] < vw / 2 ? vw - R - 16 : R + 16, ly = R + 16, s = (2 * R) / (sc * z);
    cx.save(); cx.beginPath(); cx.arc(lx, ly, R, 0, 7); cx.clip(); cx.fillStyle = '#000'; cx.fillRect(lx - R, ly - R, 2*R, 2*R);
    cx.drawImage(c, p[0] - s/2, p[1] - s/2, s, s, lx - R, ly - R, 2*R, 2*R);
    cx.strokeStyle = col; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(lx - 14, ly); cx.lineTo(lx + 14, ly); cx.moveTo(lx, ly - 14); cx.lineTo(lx, ly + 14); cx.stroke(); cx.restore();
    cx.beginPath(); cx.arc(lx, ly, R, 0, 7); cx.lineWidth = 3; cx.strokeStyle = '#fff'; cx.stroke();
  }
}
function ptr(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!crop) return; const [x, y] = ptr(e); let bi = -1, bd = 52;
  crop.quad.map(toS).forEach((p, i) => { const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; bi = i; } });
  if (bi < 0) return; drag = bi; try { cv.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); drawCrop();
});
cv.addEventListener('pointermove', e => { if (drag < 0) return; const [x, y] = ptr(e), c = crop.c; crop.quad[drag] = [Math.min(c.width, Math.max(0, (x - offX) / sc)), Math.min(c.height, Math.max(0, (y - offY) / sc))]; drawCrop(); });
const endDrag = () => { if (drag >= 0) { drag = -1; drawCrop(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { if ($('#crop').classList.contains('on')) layoutCrop(); });
$('#cAuto').onclick = () => { crop.quad = (crop.p.auto || detect(crop.c)).map(a => [...a]); drawCrop(); };
$('#cFull').onclick = () => { crop.quad = fullQuad(crop.c.width, crop.c.height); drawCrop(); };
$('#cX').onclick = () => { crop = null; show('doc'); };
$('#cOk').onclick = async () => {
  if (!quadOk(crop.quad, crop.c.width, crop.c.height)) { toast('شكل التحديد غير صالح، عدّل الزوايا'); return; }
  const p = crop.p; p.quad = crop.quad; crop = null; show('doc');
  await rerender(p);
};

/* ================= home menu ================= */
document.addEventListener('click', async e => {
  const op = e.target.closest('[data-open]'); if (op) { const d = docs.find(x => x.id === op.dataset.open); if (d) openDoc(d, 0); return; }
  const mo = e.target.closest('[data-more]'); if (!mo) return;
  const d = docs.find(x => x.id === mo.dataset.more); if (!d) return;
  sheet(d.name, pagesWord(d.pages.length), [
    {icon: 'edit', t: 'إعادة التسمية', go: async () => { const n = await askName(d.name); if (n) { d.name = n; await saveDoc(d); renderHome(); } }},
    {icon: 'share', t: 'مشاركة PDF', go: () => sharePdf(d)},
    {icon: 'dl', t: 'تنزيل PDF', go: () => downloadPdf(d)},
    {icon: 'trash', t: 'حذف', danger: true, go: async () => { if (await confirmDlg('حذف المستند؟', `سيُحذف «${d.name}» وكل صفحاته نهائياً.`, 'حذف')) { await removeDoc(d); renderHome(); } }},
  ]);
});

/* ================= start ================= */
(async () => {
  try { docs = (await dbAll()) || []; docs = docs.filter(d => d.pages && d.pages.length); } catch (e) { docs = []; toast('التخزين غير متاح في هذا المتصفح'); }
  renderHome();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let dismissed = false; try { dismissed = localStorage.getItem('sj-install-x') === '1'; } catch (e) {}
  if (ios && !standalone && !dismissed) $('#install').hidden = false;
  $('#installX').onclick = () => { $('#install').hidden = true; try { localStorage.setItem('sj-install-x', '1'); } catch (e) {} };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
